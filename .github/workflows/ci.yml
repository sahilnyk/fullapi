name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check fullapi/ unit_tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy fullapi/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[test]"
      - run: pytest unit_tests/ -v

  integration-test:
    name: Integration Test (generate + verify against spec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Write a full spec and generate the project
        run: |
          cat > /tmp/api.yaml <<'EOF'
          name: test_integration
          database: sqlite
          auth: jwt
          resources:
            - name: item
              fields:
                title: str
                price: float
                note: str?
              auth: true
          EOF
          python -m fullapi gen /tmp/api.yaml -o test_integration
      - name: Install generated project deps
        run: |
          cd test_integration && pip install -r requirements.txt
      - name: Generate the initial database migration
        run: |
          python -m fullapi migrate -o test_integration -m "initial schema"
      - name: Verify the generated app matches its own spec
        run: |
          python -m fullapi check /tmp/api.yaml --app-dir test_integration --app app.main:app
      - name: Cleanup
        if: always()
        run: rm -rf test_integration
