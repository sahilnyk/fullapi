[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fullapi"
version = "2.1.1"
description = "Spec-driven FastAPI: generate a project from api.yaml, then enforce the spec in CI (openapi drift check)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "PyYAML>=6.0",
]

authors = [{name = "Sahil Nayak"}]
maintainers = [{name = "Sahil Nayak"}]
keywords = [
    "fastapi",
    "openapi",
    "api",
    "rest",
    "cli",
    "code-generator",
    "scaffolding",
    "boilerplate",
    "template",
    "sqlalchemy",
    "pydantic",
    "jwt",
    "auth",
    "postgresql",
    "sqlite",
    "spec-driven",
    "api-first",
    "contract-testing",
    "schema-diff",
    "ci",
    "generator",
    "crud",
    "yaml",
    "python",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: FastAPI",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
    "Environment :: Console",
]

[project.optional-dependencies]
test = ["pytest", "pydantic", "pydantic-settings"]

[project.scripts]
fullapi = "fullapi.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fullapi*"]
