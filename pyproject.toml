[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fullapi"
version = "2.1.2"
description = "Spec-driven FastAPI: generate a project from api.yaml, then enforce the spec in CI (openapi drift check)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "PyYAML>=6.0",
    "rich>=13.0",
]

authors = [{name = "Sahil Nayak"}]
maintainers = [{name = "Sahil Nayak"}]
keywords = [
    "fastapi",
    "openapi",
    "api",
    "rest",
    "cli",
    "code-generator",
    "scaffolding",
    "boilerplate",
    "template",
    "sqlalchemy",
    "pydantic",
    "jwt",
    "auth",
    "postgresql",
    "sqlite",
    "spec-driven",
    "api-first",
    "contract-testing",
    "schema-diff",
    "ci",
    "generator",
    "crud",
    "yaml",
    "python",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: FastAPI",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
    "Environment :: Console",
]

[project.optional-dependencies]
test = [
    "alembic>=1.13,<2",
    "anyio>=4,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2,<3",
    "pytest>=8,<9",
    "sqlalchemy>=2,<3",
]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8,<9",
    "ruff==0.15.17",
    "types-PyYAML>=6.0",
]

[project.scripts]
fullapi = "fullapi.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fullapi*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PLW1510"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
