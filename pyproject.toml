[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fullapi"
version = "1.2.1"
description = "CLI tool for production-ready FastAPI projects with auth, Docker, databases, and cloud deployment"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
dependencies = [
    "colorama>=0.4.6",
]
authors = [
    {name = "Sahil Nayak"}
]
maintainers = [
    {name = "Sahil Nayak"}
]
keywords = ["fastapi", "api", "rest", "cli", "docker", "postgresql", "auth", "jwt", "terraform", "aws", "gcp", "azure", "microservices", "boilerplate", "template", "redis", "sqlalchemy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
fullapi = "fullapi.cli:main"

[project.urls]
Homepage = "https://github.com/sahilnyk/fullapi"
Repository = "https://github.com/sahilnyk/fullapi"

[tool.setuptools.packages.find]
where = ["."]
include = ["fullapi*"]
