[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fullapi"
version = "1.3.0"
description = "Spec-driven FastAPI: generate a project from api.yaml and enforce it in CI"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "PyYAML>=6.0",
]
authors = [
    {name = "Sahil Nayak"}
]
maintainers = [
    {name = "Sahil Nayak"}
]
keywords = ["fastapi", "api", "rest", "cli", "docker", "postgresql", "auth", "jwt", "microservices", "boilerplate", "template", "redis", "sqlalchemy", "scaffolding", "code-generator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
fullapi = "fullapi.cli:main"

[project.urls]
Homepage = "https://github.com/sahilnyk/fullapi"
Repository = "https://github.com/sahilnyk/fullapi"

[tool.setuptools.packages.find]
where = ["."]
include = ["fullapi*"]
